<svg xmlns="http://www.w3.org/2000/svg" width="630" height="880" viewBox="0 0 630 880">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#020306"/>
      <stop offset="100%" stop-color="#070914"/>
    </linearGradient>
    <linearGradient id="silver-foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="electric-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="neural-glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="630" height="880" rx="28" fill="url(#bg-grad)"/>

  <!-- Outer Metallic Foil Border -->
  <rect x="18" y="18" width="594" height="844" rx="20" fill="none" stroke="url(#silver-foil)" stroke-width="2.5" stroke-opacity="0.9"/>
  <rect x="28" y="28" width="574" height="824" rx="14" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Neural Glow Field -->
  <circle cx="315" cy="380" r="220" fill="url(#neural-glow)"/>

  <!-- Top Metadata Header -->
  <g transform="translate(48, 62)">
    <rect x="0" y="0" width="138" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="4" fill="#38bdf8"/>
    <text x="26" y="17.5" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="10.5" font-weight="700" letter-spacing="1.2">SZABIST // BSAI</text>

    <text x="534" y="17.5" text-anchor="end" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11" font-weight="600" letter-spacing="1">BATCH 2024–28</text>
  </g>

  <!-- Degree Title -->
  <text x="48" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">BACHELOR OF SCIENCE</text>
  <text x="48" y="165" fill="url(#electric-cyan)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">ARTIFICIAL INTELLIGENCE</text>
  <text x="48" y="194" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">Shaheed Zulfikar Ali Bhutto Institute of Science &amp; Technology</text>

  <!-- Divider Line -->
  <line x1="48" y1="216" x2="582" y2="216" stroke="url(#silver-foil)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Center Artwork: High-Tech Neural Matrix Emblem -->
  <g transform="translate(315, 410)">
    <!-- Orbital Rings -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="url(#silver-foil)" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 8"/>

    <!-- Neural Graph Synapses -->
    <path d="M-90,-60 L-30,-20 L0,-75 L35,-25 L85,-55" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" fill="none"/>
    <path d="M-90,60 L-30,20 L0,75 L35,25 L85,55" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.7" fill="none"/>
    <path d="M-30,-20 L0,0 L35,-25 M-30,20 L0,0 L35,25 M0,-75 L0,75" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>

    <!-- Synaptic Nodes -->
    <circle cx="-90" cy="-60" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="-30" cy="-20" r="8" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="-75" r="7" fill="#818cf8"/>
    <circle cx="35" cy="-25" r="8" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <circle cx="85" cy="-55" r="6" fill="#38bdf8" filter="url(#glow)"/>

    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="url(#silver-foil)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>

    <circle cx="-90" cy="60" r="6" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="-30" cy="20" r="8" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <circle cx="0" cy="75" r="7" fill="#38bdf8"/>
    <circle cx="35" cy="25" r="8" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="85" cy="55" r="6" fill="#818cf8" filter="url(#glow)"/>

    <!-- Telemetry Badges Around Center -->
    <text x="0" y="165" text-anchor="middle" fill="#64748b" font-family="'Courier New', monospace" font-size="10.5" letter-spacing="2">∇ TENSOR MATRIX // COGNITIVE ARCHITECTURE</text>
  </g>

  <!-- Bottom Specification Box -->
  <g transform="translate(48, 620)">
    <rect x="0" y="0" width="534" height="185" rx="14" fill="#090d16" stroke="url(#silver-foil)" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Status & Level -->
    <text x="24" y="32" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1">CURRENT STATUS // UNDERGRADUATE</text>
    <rect x="420" y="16" width="90" height="22" rx="11" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="465" y="31" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">ENROLLED</text>

    <!-- Key Modules / Focus Areas -->
    <text x="24" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">Foundational Focus &amp; Core Coursework</text>
    <text x="24" y="94" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400">
      Linear Algebra • Multivariable Calculus • Data Structures
    </text>
    <text x="24" y="118" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400">
      Discrete Mathematics • Programming Fundamentals (Python &amp; C++)
    </text>

    <!-- Interactive Hint Bar -->
    <line x1="24" y1="140" x2="510" y2="140" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="164" fill="#64748b" font-family="'Courier New', monospace" font-size="10.5" letter-spacing="1">
      ✦ HOLO CARD • CLICK TO FLIP FOR SYLLABUS DOSSIER
    </text>
    <text x="510" y="164" text-anchor="end" fill="#38bdf8" font-family="'Courier New', monospace" font-size="10.5">
      PAGE 01/02 ☍
    </text>
  </g>

  <!-- Bottom Accent Tag -->
  <text x="315" y="838" text-anchor="middle" fill="#475569" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">
    SZABIST FACULTY OF COMPUTING // ACCREDITED HEC NCEAC
  </text>
</svg>
