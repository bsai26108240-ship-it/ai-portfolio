<svg xmlns="http://www.w3.org/2000/svg" width="630" height="880" viewBox="0 0 630 880">
  <defs>
    <linearGradient id="bg-grad-o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#030406"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="silver-foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="violet-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="code-glow" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-o" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="630" height="880" rx="28" fill="url(#bg-grad-o)"/>

  <!-- Outer Metallic Foil Border -->
  <rect x="18" y="18" width="594" height="844" rx="20" fill="none" stroke="url(#silver-foil)" stroke-width="2.5" stroke-opacity="0.9"/>
  <rect x="28" y="28" width="574" height="824" rx="14" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Glow Field -->
  <circle cx="315" cy="380" r="210" fill="url(#code-glow)"/>

  <!-- Top Metadata Header -->
  <g transform="translate(48, 62)">
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#180e29" stroke="#a855f7" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="4" fill="#a855f7"/>
    <text x="26" y="17.5" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="10.5" font-weight="700" letter-spacing="1.2">CAMBRIDGE // IGCSE/O</text>

    <text x="534" y="17.5" text-anchor="end" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11" font-weight="600" letter-spacing="1">CIE ACCREDITED</text>
  </g>

  <!-- Degree Title -->
  <text x="48" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">CAMBRIDGE INTERNATIONAL</text>
  <text x="48" y="165" fill="url(#violet-accent)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">ORDINARY LEVEL (O-LEVEL)</text>
  <text x="48" y="194" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">Sciences, Computer Studies &amp; Analytical Foundations</text>

  <!-- Divider Line -->
  <line x1="48" y1="216" x2="582" y2="216" stroke="url(#silver-foil)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Center Artwork: Binary Logic & Computation Emblem -->
  <g transform="translate(315, 410)">
    <!-- Concentric Technical Rings -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#silver-foil)" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- Binary Matrix Cross -->
    <rect x="-85" y="-85" width="170" height="170" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 6"/>
    <polygon points="0,-90 90,0 0,90 -90,0" fill="none" stroke="url(#silver-foil)" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Logic Gate / Algorithm Glyphs -->
    <text x="0" y="-45" text-anchor="middle" fill="#a855f7" font-family="'Courier New', monospace" font-size="12" font-weight="700">01000001 01001001</text>
    <text x="0" y="55" text-anchor="middle" fill="#c084fc" font-family="'Courier New', monospace" font-size="12" font-weight="700">LOGIC // TRUTH TABLES</text>

    <!-- Central Node -->
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="url(#silver-foil)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#a855f7"/>

    <!-- Circuit Corners -->
    <circle cx="-60" cy="-60" r="5" fill="#ffffff" filter="url(#glow-o)"/>
    <circle cx="60" cy="-60" r="5" fill="#a855f7" filter="url(#glow-o)"/>
    <circle cx="-60" cy="60" r="5" fill="#a855f7" filter="url(#glow-o)"/>
    <circle cx="60" cy="60" r="5" fill="#ffffff" filter="url(#glow-o)"/>

    <!-- Subtitle -->
    <text x="0" y="165" text-anchor="middle" fill="#64748b" font-family="'Courier New', monospace" font-size="10.5" letter-spacing="2">BOOLEAN ALGEBRA • COMPUTATIONAL THINKING</text>
  </g>

  <!-- Bottom Specification Box -->
  <g transform="translate(48, 620)">
    <rect x="0" y="0" width="534" height="185" rx="14" fill="#090d16" stroke="url(#silver-foil)" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Status & Level -->
    <text x="24" y="32" fill="#a855f7" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1">CERTIFICATION // COMPLETED</text>
    <rect x="400" y="16" width="110" height="22" rx="11" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
    <text x="455" y="31" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">COMPLETED</text>

    <!-- Key Modules / Focus Areas -->
    <text x="24" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">Sciences &amp; Early Computing Foundations</text>
    <text x="24" y="94" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400">
      Computer Science (Algorithms, Pseudocode, Binary Systems)
    </text>
    <text x="24" y="118" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400">
      Mathematics • Physics • Chemistry • Empirical Analysis
    </text>

    <!-- Interactive Hint Bar -->
    <line x1="24" y1="140" x2="510" y2="140" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="164" fill="#64748b" font-family="'Courier New', monospace" font-size="10.5" letter-spacing="1">
      ✦ HOLO CARD • CLICK TO FLIP FOR FOUNDATIONAL RECORD
    </text>
    <text x="510" y="164" text-anchor="end" fill="#a855f7" font-family="'Courier New', monospace" font-size="10.5">
      PAGE 01/02 ☍
    </text>
  </g>

  <!-- Bottom Accent Tag -->
  <text x="315" y="838" text-anchor="middle" fill="#475569" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">
    CAMBRIDGE ASSESSMENT INTERNATIONAL EDUCATION // GENERAL CERTIFICATE OF EDUCATION
  </text>
</svg>
