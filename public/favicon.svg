<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Deep Space Backdrop -->
  <rect width="64" height="64" rx="16" fill="#040712"/>
  
  <!-- Outer Subtle Grid Frame -->
  <circle cx="32" cy="32" r="28" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Tilted Orbital Ellipses (Scientific / Quantum Motif) -->
  <ellipse cx="32" cy="32" rx="23" ry="9" stroke="url(#cyanGrad)" stroke-width="1.5" transform="rotate(-30 32 32)"/>
  <ellipse cx="32" cy="32" rx="23" ry="9" stroke="url(#violetGrad)" stroke-width="1.5" transform="rotate(30 32 32)"/>
  <ellipse cx="32" cy="32" rx="23" ry="9" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" transform="rotate(90 32 32)"/>

  <!-- Orbital Node Particles -->
  <circle cx="48" cy="23" r="2" fill="#22d3ee"/>
  <circle cx="16" cy="41" r="2" fill="#a78bfa"/>
  <circle cx="32" cy="9" r="1.5" fill="#38bdf8"/>

  <!-- Central Scientific Core -->
  <circle cx="32" cy="32" r="5" fill="url(#coreGlow)"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="cyanGrad" x1="9" y1="32" x2="55" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="9" y1="32" x2="55" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="32" cy="32" r="5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </radialGradient>
  </defs>
</svg>